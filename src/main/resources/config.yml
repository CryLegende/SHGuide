# ======================================================================== #
#                         SHGuide - Configuration                          #
# ======================================================================== #
#
# Jake, le guide du joueur : objectif du moment, programme du jour avec sa série, retour guidé après une
# absence et réponses aux questions fréquentes (« Comment faire… »). Le plugin ne connaît aucun autre plugin :
# tout passe par des placeholders (PlaceholderAPI) et des commandes écrits ici.
# Les nouveaux joueurs ont en plus un accueil (section accueil, exemple commenté en bas du fichier) : cadeaux,
# tutoriel en étapes, arrivée sur l'île et flèche vers l'étape.
#
# Commandes :
#   /guide                                        Ouvre le menu de Jake (shguide.use).
#   /guide aller                                  Lance le clic de l'objectif du moment.
#   /guide fleche                                 Coupe ou remet la flèche du tutoriel.
#   /shguide reload                               Recharge config.yml et messages.yml.
#   /shguide info <joueur>                        Programme, série et dates d'un joueur.
#   /shguide annonce <minutes|HH:MM> <texte> | <clic>
#                                                 Event qui commence dans <minutes> ou à HH:MM (heure du fuseau) : il
#                                                 devient l'objectif du moment de tout le serveur.
#   /shguide set <joueur> <serie|jour|derniere-venue|dernier-complet|premier-jour> <valeur>
#                                                 Corrige un joueur (dates 2026-11-23, « aucun » pour effacer une date).
#   /shguide accueil <joueur> <nouveau|fin|arrivee>
#                                                 Refait de lui un nouveau joueur, finit son tutoriel ou rejoue son
#                                                 arrivée là où il est (essais).
#   /shguide reset <joueur>                       Remet le guide du joueur à zéro.
#
# Permissions :
#   shguide.use                     Ouvrir le menu (/guide, clic sur Jake).
#   shguide.admin                   Toutes les sous-commandes de /shguide.
#   shguide.admin.<sous-commande>   reload, info, annonce, set, reset, accueil.
#
# Placeholders :
#   %shguide_objectif%           Texte court de l'objectif du moment (scoreboard).
#   %shguide_objectif_detail%    Première ligne de description de l'objectif.
#   %shguide_programme%          Tâches faites aujourd'hui (2).
#   %shguide_programme_total%    Tâches du jour (4).
#   %shguide_serie%              Série actuelle en jours.
#   %shguide_record%             Meilleure série.
#   %shguide_joker%              oui si le joker de la semaine est encore là, sinon non.
#   %shguide_recompense_prete%   oui si une récompense attend dans le menu.
#   %shguide_alerte%             oui si Jake a quelque chose pour le joueur (récompense, première visite du jour).
#   %shguide_nouveautes_nombre%  Nouveautés depuis la dernière venue (0 à nouveautes-max).
#   %shguide_nouveaute_<n>%      Texte de la n-ième nouveauté (vide s'il n'y en a pas).
#   %shguide_menu_vu%            oui si le joueur a ouvert le menu de Jake aujourd'hui.
#   %shguide_nouveau%            oui pour un joueur arrivé depuis l'accueil (premier jour connu), non pour un ancien.
#   %shguide_accueil_temps%      Temps de jeu restant avant le cadeau « rester » (m:ss), vide une fois le cadeau donné.
#   %shguide_tutoriel%           oui tant que le tutoriel du joueur n'est pas fini.
#   %shguide_tutoriel_fini%      oui quand le tutoriel est terminé.
#   %shguide_tutoriel_etape%     Numéro de l'étape en cours.
#   %shguide_tutoriel_total%     Nombre d'étapes du tutoriel.
#   %shguide_tutoriel_texte%     Texte de l'étape en cours (vide si le tutoriel est fini).
#
# Conditions : « A opérateur B », les deux côtés passent par les placeholders du joueur.
#   Opérateurs : ==  !=  >=  <=  >  <  et ~ (expression régulière cherchée dans A, B n'est pas lu par PlaceholderAPI).
#   Deux nombres se comparent comme des nombres (« 12 273 » et « 5.0 » sont lus), sinon comme du texte sans la casse.
#
# Jetons des objectifs : {i} (boucle), {joueur}, {annonce} {annonce_texte} {annonce_clic}, {recompense_prete},
#   {tache_proche} {tache_proche_texte} {tache_proche_clic}, {tache_suivante} {tache_suivante_texte} {tache_suivante_clic},
#   {tuto} {tuto_texte} {tuto_clic} {tuto_description} {tuto_n} {tuto_total} (étape en cours du tutoriel).
#   Les jetons oui/non valent « oui » ou « non ».
# Jetons des tâches : {objectif} (quantité du palier).
# Commandes : lancées par le joueur, sauf celles qui commencent par [console] ({joueur} = son pseudo).
#
# Un reload valide config.yml et messages.yml avant de les appliquer : si l'un est invalide, rien ne change et le
# message donne le fichier et l'erreur. Demande un redémarrage : base-de-donnees.
#
# ======================================================================== #

base-de-donnees:
  hote: 127.0.0.1
  port: 3306
  base: minecraft
  utilisateur: utilisateur
  mot-de-passe: "CHANGE_ME"

# Fuseau des journées : le programme repart à minuit dans ce fuseau.
fuseau: Europe/Paris

# Intervalle, en secondes, entre deux vérifications du programme et de l'objectif d'un joueur.
verification-secondes: 10

# Secondes après la connexion avant de prendre la valeur de départ d'un compteur : les plugins finissent de charger
# les données du joueur, et un nouveau joueur termine ses quêtes automatiques.
depart-apres-connexion-secondes: 30

# Part de l'objectif d'une tâche à partir de laquelle elle devient « presque finie ».
seuil-presque: 0.8

# Palier du joueur (1 à 5), lu à sa première vérification du jour et gardé jusqu'à minuit.
palier: "1"

programme:
  # Tâches données chaque jour à tout le monde.
  #   compteurs   placeholders numériques : la tâche avance de ce qu'ils gagnent depuis le début de la journée
  #               (plusieurs compteurs s'additionnent)
  #   compte      placeholders comptés quand ils valent « egal » ; la tâche avance de ce nombre depuis le début
  #               de la journée (la remise à zéro du plugin compté fait redescendre le départ)
  #   valeur      un placeholder numérique lu tel quel, sans départ (ex. les votes du jour, faits avant la connexion)
  #   objectif    quantité à atteindre, une seule valeur ou cinq (paliers 1 à 5)
  #   description lignes du bouton dans le menu, sous le sous-titre (facultatif)
  #   si          conditions (toutes vraies) pour garder la tâche ; décidé une fois par jour, au moment où les
  #               départs sont pris (facultatif)
  #   sinon       « tournante » : si une condition est fausse, la tâche est remplacée pour la journée par la
  #               tâche tournante qui suit celle du jour (ex. une tâche de quête pour un joueur qui a tout fini)
  taches:
    niveau:
      texte: "Gagner un niveau d'XP"
      icone: EXPERIENCE_BOTTLE
      clic: ""
      compteurs:
        - "%player_level%"
      objectif:
        - 1
    creatif:
      texte: "Passer en mode créatif"
      icone: GRASS_BLOCK
      clic: ""
      compte:
        valeurs:
          - "%player_gamemode%"
        egal: "CREATIVE"
      objectif:
        - 1
  # Tâches tournantes : une seule par jour, la même pour tout le serveur, chacune à son tour.
  tournantes:
    sauts:
      texte: "Sauter {objectif} fois"
      icone: RABBIT_FOOT
      clic: ""
      compteurs:
        - "%statistic_jump%"
      objectif:
        - 3
        - 6
        - 9
        - 12
        - 15
  # Commandes lancées quand le joueur récupère un jour complet.
  recompense:
    - "[console] give {joueur} diamond 1"
  # Récompense en plus (facultatif), différente chaque jour et la même pour tout le serveur : recompenses-ordre
  # est parcouru jour après jour (ordre des clés de recompenses-du-jour s'il manque). Un programme fini puis
  # récupéré après minuit garde la récompense de son jour. Le menu montre celle d'aujourd'hui et de demain.
  recompenses-du-jour:
    diamant:
      texte: "1 diamant"
      commandes:
        - "[console] give {joueur} diamond 1"
    emeraude:
      texte: "1 émeraude"
      commandes:
        - "[console] give {joueur} emerald 1"
  recompenses-ordre:
    - diamant
    - emeraude

serie:
  # Les paliers recommencent après ce nombre de jours (jour 37 = palier 7).
  cycle: 30
  # Commandes données en plus de la récompense du jour quand la série atteint ce jour du cycle.
  paliers:
    7:
      - "[console] give {joueur} emerald 1"
    14:
      - "[console] give {joueur} emerald 2"
    21:
      - "[console] give {joueur} emerald 3"
    30:
      - "[console] give {joueur} nether_star 1"

# Objectif du moment : le premier dont toutes les conditions sont vraies.
# « boucle » (de, a) essaie {i} de « de » à « a » et garde le premier {i} qui marche.
objectifs:
  annonce:
    si:
      - "{annonce} == oui"
    texte: "{annonce_texte}"
    description:
      - "&7Clique pour y aller."
    clic: "{annonce_clic}"
    icone: CLOCK
  recompense:
    si:
      - "{recompense_prete} == oui"
    texte: "Récompense du jour à prendre"
    description:
      - "&7Clique pour l'ouvrir."
    clic: "guide"
    icone: CHEST
  presque:
    si:
      - "{tache_proche} == oui"
    texte: "{tache_proche_texte}"
    description:
      - "&7Tu y es presque."
    clic: "{tache_proche_clic}"
    icone: SPYGLASS
  suivante:
    si:
      - "{tache_suivante} == oui"
    texte: "{tache_suivante_texte}"
    description:
      - "&7Une tâche du programme du jour."
    clic: "{tache_suivante_clic}"
    icone: WRITABLE_BOOK
  bravo:
    si:
      - "{recompense_prete} == non"
    texte: "Programme du jour fini, à demain !"
    description:
      - "&7Reviens demain pour garder ta série."
    clic: ""
    icone: CAKE

retour:
  # Absence minimale, en jours, pour accueillir le joueur à sa connexion.
  jours: 3
  # Délai après la connexion, en ticks.
  delai-ticks: 60
  # Condition pour ouvrir le dialogue ; sinon les lignes « retour » de messages.yml sont envoyées dans le chat.
  dialogue-si: "%viaversion_player_protocol_id% >= 771"
  dialogue:
    - "[console] shdialogs open retour {joueur}"
  # Nouveautés montrées au retour : seules celles parues après la dernière venue, les plus récentes d'abord.
  nouveautes-max: 2
  nouveautes:
    - date: "2026-11-23"
      texte: "Jake devient ton guide"

# Une annonce devient l'objectif du moment ce nombre de minutes avant le début de l'event.
annonce-avant-minutes: 15
# Minutes pendant lesquelles elle le reste après l'heure de début.
annonce-apres-debut-minutes: 5

# Barre en haut de l'écran de tout le serveur pour l'event annoncé, avec son compte à rebours, pendant les
# « minutes-avant » qui précèdent son début, puis « commence maintenant » pendant annonce-apres-debut-minutes.
# Les rappels du bot des évènements l'annoncent avec la commande de rappel « shguide annonce {heure} {nom} | events ».
# Textes : annonce.barre et annonce.barre-commence dans messages.yml.
annonce-barre:
  actif: true
  minutes-avant: 30
  couleur: PURPLE

menu:
  cases:
    jake: 4
    objectif: 13
    recompense: 24
    aide: 29
    ile: 31
    reglages: 33
    serie: 40
  # Cases des tâches du jour, dans l'ordre (tâches fixes puis tâche tournante).
  taches:
    - 20
    - 21
    - 22
    - 23
  # Icônes : un matériau (CHEST), une tête HeadDatabase (hdb-<id>) ou une tête texturée (basehead-<base64>),
  # comme dans DeluxeMenus. Vaut aussi pour les « icone » des tâches, objectifs et réponses.
  icones:
    jake: PLAYER_HEAD
    contour: BLACK_STAINED_GLASS_PANE
    accent: CYAN_STAINED_GLASS_PANE
    # vide = une tâche faite garde son icône, qui brille
    fait: ""
    recompense-fermee: CHEST
    recompense-prete: CHEST
    recompense-prise: CHEST
    aide: BOOK
    ile: GRASS_BLOCK
    reglages: COMPARATOR
    serie: CAMPFIRE
    retour: PAPER
  ile-commande: "is"
  reglages-commande: "jake reglages"

# « Comment faire… » : un bouton par question, dix au plus. fermer = ferme le menu avant les commandes.
aide:
  ile:
    icone: GRASS_BLOCK
    nom: "&bRetourner sur mon île"
    description:
      - "&7Te téléporte sur ton île."
    commandes:
      - "is go"
    fermer: true

# Sons joués au joueur, vides = aucun.
sons:
  ouverture: ui.toast.in
  clic: ui.button.click
  tache: entity.experience_orb.pickup
  programme: ui.toast.challenge_complete
  recompense: entity.player.levelup

