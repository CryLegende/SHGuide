# Autres cibles de la flèche (même style que accueil.fleche, qui doit être active), relues deux fois par seconde : la
# première cible lisible passe avant celle du tutoriel. « cible » = « monde x y z » ou un placeholder qui le donne,
# vide = pas de flèche.
# fleches:
#   exemple:
#     cible: "%un_placeholder_de_position%"
#     nom: "%un_placeholder_de_nom%"
