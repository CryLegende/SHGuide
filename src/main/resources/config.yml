# ======================================================================== #
#                         SHGuide - Configuration                          #
# ======================================================================== #
#
# Jake, le guide du joueur : objectif du moment, programme du jour avec sa série, retour guidé après une
# absence et accueil des nouveaux. Les écrans de Jake sont dans menus.yml, les nouveautés dans nouveautes.yml, les messages
# dans messages.yml. Le plugin ne connaît aucun autre plugin :
# tout passe par des placeholders (PlaceholderAPI) et des commandes écrits ici.
# Les nouveaux joueurs ont en plus un accueil (section accueil, exemple commenté en bas du fichier) : cadeaux,
# tutoriel en étapes, arrivée sur l'île et flèche vers l'étape.
#
# Commandes :
#   /guide [écran]                                Ouvre Jake, ou un de ses écrans (menus.yml : taches, recompenses...).
#   /guide aller                                  Lance le clic de l'objectif du moment.
#   /guide fleche                                 Coupe ou remet la flèche du tutoriel.
#   /guide retour [commande]                      Bouton Retour d'un menu ouvert par Jake : revient à l'écran de Jake d'où
#                                                 vient le joueur, sinon lance la commande.
#   /shguide reload                               Recharge config.yml, menus.yml, nouveautes.yml et messages.yml.
#   /shguide info <joueur>                        Programme, série et dates d'un joueur.
#   /shguide annonce <minutes|HH:MM> <texte> | <clic>
#                                                 Event qui commence dans <minutes> ou à HH:MM (heure du fuseau) : il
#                                                 devient l'objectif du moment de tout le serveur.
#   /shguide set <joueur> <serie|jour|derniere-venue|dernier-complet|premier-jour> <valeur>
#                                                 Corrige un joueur (dates 2026-11-23, « aucun » pour effacer une date).
#   /shguide accueil <joueur> <nouveau|fin|arrivee>
#                                                 Refait de lui un nouveau joueur, finit son tutoriel ou rejoue son
#                                                 arrivée là où il est (essais).
#   /shguide reset <joueur>                       Remet le guide du joueur à zéro.
#
# Permissions :
#   shguide.use                     Ouvrir le menu (/guide, clic sur Jake).
#   shguide.admin                   Toutes les sous-commandes de /shguide.
#   shguide.admin.<sous-commande>   reload, info, annonce, set, reset, accueil.
#
# Placeholders :
#   %shguide_objectif%           Objectif du moment, court (scoreboard) : ce qu'il faut faire, ou son nom si c'est trop long.
#   %shguide_objectif_nom%       Nom de l'objectif.
#   %shguide_objectif_faire%     Ce qu'il faut faire, en entier.
#   %shguide_objectif_detail%    Première ligne de description de l'objectif.
#   %shguide_ligne%              Ligne du scoreboard (messages.yml, scoreboard).
#   %shguide_programme%          Tâches faites aujourd'hui (2).
#   %shguide_programme_total%    Tâches du jour (4).
#   %shguide_serie%              Série actuelle en jours.
#   %shguide_record%             Meilleure série.
#   %shguide_joker%              oui si le joker de la semaine est encore là, sinon non.
#   %shguide_recompense_prete%   oui si une récompense attend dans le menu.
#   %shguide_cadeaux%            Nombre de cadeaux à récupérer.
#   %shguide_alerte%             oui si Jake a quelque chose pour le joueur, %shguide_alerte_texte% dit quoi.
#   %shguide_fin_jour%           Temps avant les nouvelles tâches.
#   %shguide_retour%             Texte du retour guidé, sur plusieurs lignes (messages.yml, retour.lignes).
#   %shguide_nouveautes_non_lues% Nouveautés que le joueur n'a pas encore vues.
#   %shguide_nouveautes_nombre%  Nouveautés sorties depuis la dernière venue.
#   %shguide_nouveaute_<n>%      Titre de la n-ième d'entre elles (vide s'il n'y en a pas).
#   %shguide_menu_vu%            oui si le joueur a ouvert le menu de Jake aujourd'hui.
#   %shguide_nouveau%            oui pour un joueur arrivé depuis l'accueil (premier jour connu), non pour un ancien.
#   %shguide_accueil_temps%      Temps de jeu restant avant le cadeau « rester » (m:ss), vide une fois le cadeau donné.
#   %shguide_tutoriel%           oui tant que le tutoriel du joueur n'est pas fini.
#   %shguide_tutoriel_fini%      oui quand le tutoriel est terminé.
#   %shguide_tutoriel_etape%     Numéro de l'étape en cours.
#   %shguide_tutoriel_total%     Nombre d'étapes du tutoriel.
#   %shguide_tutoriel_texte%     Texte de l'étape en cours (vide si le tutoriel est fini).
#
# Conditions : « A opérateur B », les deux côtés passent par les placeholders du joueur.
#   Opérateurs : ==  !=  >=  <=  >  <  et ~ (expression régulière cherchée dans A, B n'est pas lu par PlaceholderAPI).
#   Deux nombres se comparent comme des nombres (« 12 273 » et « 5.0 » sont lus), sinon comme du texte sans la casse.
#
# Jetons des objectifs : {i} (boucle), {joueur}, {annonce} {annonce_texte} {annonce_clic}, {recompense_prete},
#   {tache_proche} {tache_proche_texte} {tache_proche_clic}, {tache_suivante} {tache_suivante_texte} {tache_suivante_clic},
#   {tuto} {tuto_texte} {tuto_clic} {tuto_description} {tuto_n} {tuto_total} (étape en cours du tutoriel).
#   Les jetons oui/non valent « oui » ou « non ».
# Jetons des tâches : {objectif} (quantité du palier), ou {objectif|quête|quêtes} pour l'accorder ; {quantite} dans la description.
# Commandes : lancées par le joueur, sauf celles qui commencent par [console] ({joueur} = son pseudo).
#
# Moments : à chaque moment du guide, la liste de commandes du même nom (section moments, plus bas) est lancée pour le
#   joueur concerné, sur le fil principal, écrite comme les autres commandes de ce fichier. {joueur} et les jetons du
#   moment sont remplacés d'abord, puis les placeholders PlaceholderAPI (lus pour ce joueur). Les jetons de texte libre
#   ({tache} {etape} {nom}) sont donnés sans le caractère %, pour qu'un texte ne devienne jamais un placeholder ; les jetons
#   numériques peuvent servir dans un placeholder. Une liste vide ou absente ne fait rien. Le plugin ne sait pas ce que font
#   ces commandes. Au démarrage, une section moments invalide n'arrête pas le plugin : la console nomme la clé et aucun moment
#   ne part ; /shguide reload refuse le fichier.
#   tache-faite          Une tâche du jour vient d'être faite, pas la dernière : {tache} {faites} {total} {restantes}
#   programme-complet    La dernière tâche du jour vient d'être faite : {serie}
#   palier               Un palier de série vient d'être atteint : {palier} (le jour du palier)
#   cadeau-pret          Un cadeau vient d'arriver dans les récompenses : {cadeaux} (ceux qui attendent)
#   cadeau-pris          Le joueur vient de récupérer un cadeau, un lancement par cadeau : {sorte} (jour, palier, bienvenue, demain)
#   etape-faite          Une étape du tutoriel vient d'être faite : {etape} (son identifiant) {numero} {total}
#   tutoriel-fini        Le tutoriel est fini.
#   retour               Le joueur revient après l'absence du retour guidé : {jours} (jours d'absence)
#   annonce              Une annonce d'event devient visible pour le joueur, une fois par annonce et par joueur : {nom} {minutes}
#                        (minutes avant le début à ce moment). Une annonce, c'est un nom et une minute de début : les rappels
#                        « shguide annonce HH:MM ... » du même event restent la même annonce. Elle part pour au plus
#                        moments-par-seconde joueurs par seconde (les autres attendent leur tour), et un redémarrage ou un
#                        rechargement du plugin oublie ce qui a été dit : elle repart au rappel suivant du bot.
#
# Un reload valide les quatre fichiers avant de les appliquer : si l'un est invalide, rien ne change et le message
# donne le fichier et l'erreur. Demande un redémarrage : base-de-donnees.
#
# ======================================================================== #

base-de-donnees:
  hote: 127.0.0.1
  port: 3306
  base: minecraft
  utilisateur: utilisateur
  mot-de-passe: "CHANGE_ME"

# Fuseau des journées : le programme repart à minuit dans ce fuseau.
fuseau: Europe/Paris

# Intervalle, en secondes, entre deux vérifications du programme et de l'objectif d'un joueur.
verification-secondes: 10
# Joueurs vérifiés par tick au plus : avec beaucoup de monde, chacun attend un peu plus longtemps.
verification-par-tick: 1

# Secondes après la connexion avant de prendre la valeur de départ d'un compteur : les plugins finissent de charger
# les données du joueur, et un nouveau joueur termine ses quêtes automatiques.
depart-apres-connexion-secondes: 30

# Placeholders coûteux : lus au plus une fois par « secondes » pour un joueur, sauf quand il ouvre un écran de Jake.
placeholders-lents:
  secondes: 30
  liste:
    # additionne tous les types de blocs du jeu, 0,6 ms
    - "%statistic_mine_block%"

# Part de l'objectif d'une tâche à partir de laquelle elle devient « presque finie ».
seuil-presque: 0.8

# Palier du joueur (1 à 5), lu à sa première vérification du jour et gardé jusqu'à minuit.
palier: "1"

programme:
  # Tâches données chaque jour à tout le monde.
  #   compteurs   placeholders numériques : la tâche avance de ce qu'ils gagnent depuis le début de la journée
  #               (plusieurs compteurs s'additionnent)
  #   compte      placeholders comptés quand ils valent « egal » ; la tâche avance de ce nombre depuis le début
  #               de la journée (la remise à zéro du plugin compté fait redescendre le départ)
  #   valeur      un placeholder numérique lu tel quel, sans départ (ex. les votes du jour, faits avant la connexion)
  #   objectif    quantité à atteindre, une seule valeur ou cinq (paliers 1 à 5)
  #   description lignes du bouton dans le menu, sous le sous-titre (facultatif)
  #   si          conditions (toutes vraies) pour garder la tâche ; décidé une fois par jour, au moment où les
  #               départs sont pris (facultatif)
  #   sinon       « tournante » : si une condition est fausse, la tâche est remplacée pour la journée par la
  #               tâche tournante qui suit celle du jour (ex. une tâche de quête pour un joueur qui a tout fini)
  #   recompense  commandes lancées une fois par jour, au moment où la tâche est faite, même si c'est la dernière
  #               du jour (facultatif, tâches tournantes comprises) ; écrites comme programme.recompense, avec
  #               {joueur} et les placeholders du joueur
  taches:
    niveau:
      texte: "Gagner un niveau d'XP"
      icone: EXPERIENCE_BOTTLE
      clic: ""
      compteurs:
        - "%player_level%"
      objectif:
        - 1
      # recompense:
      #   - "[console] give {joueur} experience_bottle 3"
    creatif:
      texte: "Passer en mode créatif"
      icone: GRASS_BLOCK
      clic: ""
      compte:
        valeurs:
          - "%player_gamemode%"
        egal: "CREATIVE"
      objectif:
        - 1
  # Tâches tournantes : une seule par jour, la même pour tout le serveur, chacune à son tour.
  tournantes:
    sauts:
      texte: "Sauter {objectif} fois"
      icone: RABBIT_FOOT
      clic: ""
      compteurs:
        - "%statistic_jump%"
      objectif:
        - 3
        - 6
        - 9
        - 12
        - 15
  # Ce que donnent ces commandes, écrit dans les menus et les messages.
  recompense-texte: "1 diamant"
  # Commandes lancées quand le joueur récupère le cadeau d'un jour complet.
  recompense:
    - "[console] give {joueur} diamond 1"
  # Récompense en plus (facultatif), différente chaque jour et la même pour tout le serveur : recompenses-ordre
  # est parcouru jour après jour (ordre des clés de recompenses-du-jour s'il manque). Un programme fini puis
  # récupéré après minuit garde la récompense de son jour. Le menu montre celle d'aujourd'hui et de demain.
  recompenses-du-jour:
    diamant:
      texte: "1 diamant"
      commandes:
        - "[console] give {joueur} diamond 1"
    emeraude:
      texte: "1 émeraude"
      commandes:
        - "[console] give {joueur} emerald 1"
  recompenses-ordre:
    - diamant
    - emeraude

serie:
  # Les paliers recommencent après ce nombre de jours (jour 37 = palier 7).
  cycle: 30
  # Commandes données en plus de la récompense du jour quand la série atteint ce jour du cycle.
  paliers:
    7:
      - "[console] give {joueur} emerald 1"
    14:
      - "[console] give {joueur} emerald 2"
    21:
      - "[console] give {joueur} emerald 3"
    30:
      - "[console] give {joueur} nether_star 1"
  # Ce que donne chaque palier, écrit dans les menus et les messages.
  gains:
    7: "1 émeraude"
    14: "2 émeraudes"
    21: "3 émeraudes"
    30: "1 étoile du Nether"

# Longueur au plus de l'objectif dans le scoreboard, en caractères.
objectif-longueur-max: 30

# Objectif du moment : le premier dont toutes les conditions sont vraies.
# « boucle » (de, a) essaie {i} de « de » à « a » et garde le premier {i} qui marche, ou celui dont « tri » est le plus petit.
#   texte     son nom                         faire   ce qu'il faut faire (facultatif)
#   description, clic, icone
# Le scoreboard montre « faire » s'il tient en objectif-longueur-max caractères, sinon le nom.
objectifs:
  annonce:
    si:
      - "{annonce} == oui"
    texte: "{annonce_texte}"
    description:
      - "&7Cliquez pour y aller."
    clic: "{annonce_clic}"
    icone: CLOCK
  recompense:
    si:
      - "{recompense_prete} == oui"
    texte: "Cadeau à récupérer"
    description:
      - "&7Cliquez pour l'ouvrir."
    clic: "guide recompenses"
    icone: CHEST
  presque:
    si:
      - "{tache_proche} == oui"
    texte: "{tache_proche_texte}"
    description:
      - "&7Vous y êtes presque."
    clic: "{tache_proche_clic}"
    icone: SPYGLASS
  suivante:
    si:
      - "{tache_suivante} == oui"
    texte: "{tache_suivante_texte}"
    description:
      - "&7Une de vos tâches du jour."
    clic: "{tache_suivante_clic}"
    icone: WRITABLE_BOOK
  bravo:
    si:
      - "{recompense_prete} == non"
    texte: "Tâches du jour finies, à demain !"
    description:
      - "&7Revenez demain pour garder votre série."
    clic: ""
    icone: CAKE

retour:
  # Absence minimale, en jours, pour accueillir le joueur à sa connexion.
  jours: 3
  # Délai après la connexion, en ticks.
  delai-ticks: 60
  # Condition pour ouvrir le dialogue ; sinon les lignes « retour » de messages.yml sont envoyées dans le chat.
  dialogue-si: "%viaversion_player_protocol_id% >= 771"
  dialogue:
    - "[console] shdialogs open retour {joueur}"
  # Nouveautés (nouveautes.yml) citées au retour et dans l'accueil de Jake, les plus récentes d'abord.
  nouveautes-max: 3

# Nouveautés : jours pendant lesquels une nouveauté pas encore vue est signalée, et écriture de sa date.
nouveautes-recentes-jours: 30
nouveautes-date: "dd/MM"

# Une annonce devient l'objectif du moment ce nombre de minutes avant le début de l'event.
annonce-avant-minutes: 15
# Minutes pendant lesquelles elle le reste après l'heure de début.
annonce-apres-debut-minutes: 5

# Barre en haut de l'écran de tout le serveur pour l'event annoncé, avec son compte à rebours, pendant les
# « minutes-avant » qui précèdent son début, puis « commence maintenant » pendant annonce-apres-debut-minutes.
# Les rappels du bot des évènements l'annoncent avec la commande de rappel « shguide annonce {heure} {nom} | events ».
# Textes : annonce.barre et annonce.barre-commence dans messages.yml.
annonce-barre:
  actif: true
  minutes-avant: 30
  couleur: PURPLE

# Sons joués au joueur, vides = aucun.
sons:
  ouverture: ui.toast.in
  # clic sur un bouton qui lance une commande
  clic: ui.button.click
  tache: entity.experience_orb.pickup
  programme: ui.toast.challenge_complete
  recompense: entity.player.levelup
  refus: entity.villager.no
  # un cadeau arrive dans les récompenses (cadeau de bienvenue, cadeau du lendemain)
  cadeau: block.note_block.pling
  # une étape du tutoriel est faite
  etape: entity.experience_orb.pickup
  # le tutoriel est fini
  tutoriel-fin: ui.toast.challenge_complete

# Joueurs pour qui le moment « annonce » part au plus à chaque seconde : une annonce vue par tout le serveur ne lance pas
# toutes ses commandes d'un coup.
moments-par-seconde: 10

# Commandes lancées à chaque moment du guide (voir « Moments » en haut du fichier). Une liste vide ne fait rien.
# Exemple, à écrire sous le moment voulu à la place de « [] » :
#   tache-faite:
#     - "[console] say {joueur} a fini une tâche, {faites} sur {total} : {tache}"
moments:
  tache-faite: []
  programme-complet: []
  palier: []
  cadeau-pret: []
  cadeau-pris: []
  etape-faite: []
  tutoriel-fini: []
  retour: []
  annonce: []

# ------------------------------------------------------------------------ #
