# ============================================================================
#  SHGuide : messages du chat, objectif, scoreboard, alerte et retour
# ============================================================================
#  Codes couleur & et &#RRGGBB acceptés. Format SkyHand pour le chat : préfixe
#  de la couleur du type, texte en &7, mots importants dans la couleur du type.
#    &a succès · &e information · &6 avertissement · &c erreur
#  Un message vide n'est pas envoyé. Les écrans de Jake sont dans menus.yml.
#
#  Accords : {n|tâche|tâches} écrit « 1 tâche » ou « 2 tâches » (scoreboard,
#  alerte et retour seulement ; les messages du chat reçoivent le texte accordé).
# ============================================================================

chat:
  # {reste} : reste-une ou reste-plusieurs
  tache-faite: "&7&l« &a&lJake &8&l» &7Tâche du jour faite, &a{reste}&7."
  reste-plusieurs: "plus que {n}"
  reste-une: "plus qu'une"
  programme-complet: "&7&l« &a&lJake &8&l» &7Vos tâches du jour sont faites, votre cadeau vous attend dans &a/jake&7."
  recompense: "&7&l« &a&lJake &8&l» &7Cadeau récupéré{gain}&7. Série de &a{serie}&7."
  # {gain} des deux messages de cadeau, vide s'il n'y a rien à dire
  recompense-gain: ", &a{texte}"
  recompense-palier: "&7&l« &a&lJake &8&l» &7Palier de &a{jour} jours &7atteint, &a{gain} &7pour vous !"
  recompense-accueil: "&7&l« &a&lJake &8&l» &7Cadeau récupéré{gain}&7. Bon jeu !"
  rien-a-prendre: "&7&l« &e&lJake &8&l» &7Rien à récupérer pour l'instant."
  chargement: "&7&l« &e&lJake &8&l» &7Votre guide se charge, réessayez dans une seconde."
  joueurs-seulement: "&7&l« &c&lJake &8&l» &7Commande réservée aux joueurs."
  permission: "&7&l« &c&lJake &8&l» &7Vous n'avez pas la permission."
  utilisation: "&7&l« &e&lJake &8&l» &7Tapez &e{commandes}&7."
  joueur-inconnu: "&7&l« &c&lJake &8&l» &7Joueur &c{joueur} &7introuvable ou pas connecté."
  reload-ok: "&7&l« &a&lSHGuide &8&l» &7Configuration rechargée."
  reload-erreur: "&7&l« &c&lSHGuide &8&l» &7{fichier} invalide, rien n'a changé. &c{erreur}"
  annonce-ok: "&7&l« &a&lSHGuide &8&l» &7Annonce posée, début dans &a{minutes} min&7."
  set-ok: "&7&l« &a&lSHGuide &8&l» &7{champ} de &a{joueur} &7mis à &a{valeur}&7."
  set-erreur: "&7&l« &c&lSHGuide &8&l» &7Valeur refusée pour {champ}, &c{valeur}&7."
  reset-ok: "&7&l« &a&lSHGuide &8&l» &7Guide de &a{joueur} &7remis à zéro."
  accueil-ok: "&7&l« &a&lSHGuide &8&l» &7Accueil de &a{joueur}&7, {action} fait."
  # Accueil des nouveaux joueurs (section accueil de config.yml)
  accueil-rester: "&7&l« &a&lJake &8&l» &7Merci pour ces {minutes} minutes de jeu ! Votre cadeau, &a{gain}&7, vous attend dans &a/jake&7."
  accueil-demain-annonce: "&7&l« &a&lJake &8&l» &7Et revenez demain, je vous garde &b{gain}&7."
  accueil-demain-pret: "&7&l« &a&lJake &8&l» &7Content de vous revoir ! Votre cadeau, &b{gain}&7, vous attend dans &a/jake&7."
  tutoriel-etape: "&7&l« &a&lJake &8&l» &7Étape &a{n}/{total} &7faite, &a{texte}&7.{gain}"
  tutoriel-gain: " Vous gagnez &a{texte}&7."
  tutoriel-suivante: "&7&l« &e&lJake &8&l» &7Étape suivante, &e{texte}&7."
  tutoriel-fini: "&7&l« &a&lJake &8&l» &7Tutoriel terminé, bravo ! Vos tâches du jour vous attendent dans &a/jake&7."
  fleche-on: "&7&l« &a&lJake &8&l» &7Flèche du tutoriel &aaffichée&7."
  fleche-off: "&7&l« &e&lJake &8&l» &7Flèche du tutoriel &ecachée&7."
  info:
    - "&7&l« &e&lSHGuide &8&l» &e{joueur} &7jour {jour}, palier {palier}, tâches {faites}/{total}"
    - "&7Série {serie} (record {record}), joker {joker}, dernière venue {venue}, à prendre {attente}"

# Commande lancée quand on clique sur un message du chat (même clé que le message), et texte montré au survol.
clics:
  survol: "&7Cliquez pour ouvrir"
  tache-faite: "guide taches"
  programme-complet: "guide recompenses"
  recompense: "guide"
  recompense-accueil: "guide"
  accueil-rester: "guide recompenses"
  accueil-demain-pret: "guide recompenses"
  tutoriel-etape: "guide premiers-pas"
  tutoriel-suivante: "guide premiers-pas"
  tutoriel-fini: "guide taches"

# Plusieurs cadeaux du jour pris d'un coup, et ce qui sépare les cadeaux dans une phrase
recompense-plusieurs: "{n} fois {texte}"
recompense-separateur: "&7, &a"

mots:
  jour: "jour"
  jours: "jours"

# Temps avant les nouvelles tâches
duree:
  heures: "{h} h {m} min"
  minutes: "{m} min"

# Objectif du moment
objectif:
  aucun: "Explorer votre île"
  presque: "Plus que {reste} · {tache}"
  annonce-bientot: "{texte} dans {minutes} min"
  annonce-commence: "{texte} commence"

# Ligne %shguide_ligne% : {faites} {total} {serie} {cadeaux} {tuto_n} {tuto_total}
scoreboard:
  tutoriel: "&7Étape &a{tuto_n}&7/&a{tuto_total} &7du tutoriel"
  cadeau: "&a&lCadeau prêt ! &7/jake"
  serie: "&b{faites}&7/&b{total} &7tâches · série &6{serie} j"
  taches: "&b{faites}&7/&b{total} &7tâches du jour"

# Ligne au-dessus de Jake (%shguide_alerte_texte%), la première qui s'applique ; vide = pas de ligne.
alerte:
  cadeau: "&a&l! &aCadeau prêt"
  nouveautes: "&e&l! &e{nouveautes|nouveauté|nouveautés}"
  taches: "&e&l! &eVos tâches du jour"

# Retour après une absence. « lignes » : dialogue (%shguide_retour%) et chat des versions sans dialogues.
# Jetons : {joueur} {objectif} {cadeaux} {nouveautes} {autres}, et {nouveautes_liste} (une ligne « nouveaute » par
# nouveauté montrée, config.yml retour.nouveautes-max).
retour:
  lignes:
    - "[si {cadeaux} >= 1] &aUn cadeau vous attend."
    - "[si {cadeaux} >= 1] "
    - "[si {nouveautes} >= 1] &7Depuis votre dernière venue"
    - "{nouveautes_liste}"
    - "[si {autres} >= 1] &7et {autres|autre nouveauté|autres nouveautés}"
    - "[si {nouveautes} >= 1] "
    - "&7Votre objectif du moment"
    - "&b{objectif}"
  nouveaute: "&e✦ &f{titre}"
  # Chat des versions sans dialogues : ces lignes, celles d'au-dessus, puis un bouton.
  chat:
    - "&7&l« &e&lJake &8&l» &7Content de vous revoir, &e{joueur} &7!"
  bouton: "&e&l[Ouvrir le menu de Jake]"
  bouton-nouveautes: "&e&l[Voir les nouveautés]"
  bouton-cadeau: "&a&l[Récupérer mon cadeau]"

# Accueil des nouveaux joueurs : barres du haut de l'écran et texte de la flèche
accueil:
  barre-rester: "&e&lCadeau de bienvenue &8· &f{gain} &7dans &e{temps}"
  barre-rester-pause: "&e&lCadeau de bienvenue &8· &7en pause pendant l'AFK"
  barre-demain: "&b&lRevenez demain &8· &7Jake vous garde &b{gain}"
  barre-tutoriel: "&a&lÉtape {n}/{total} &8· &f{texte}"
  # {hauteur} : fleche-haut ou fleche-bas quand la cible est nettement plus haute ou plus basse, sinon rien
  fleche: "&f{nom} &7{distance} m{hauteur}"
  fleche-haut: " &b▲"
  fleche-bas: " &b▼"

# Barre de l'event annoncé (/shguide annonce, rappels du bot) : {texte} nom de l'event, {temps} compte à rebours
annonce:
  barre: "&d&l{texte} &8· &7commence dans &d{temps} &8· &7/events"
  barre-commence: "&d&l{texte} &8· &acommence maintenant &8· &7/events"
