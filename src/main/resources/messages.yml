# ============================================================================
#  SHGuide : messages du chat, menu de Jake, objectif du moment et retour
# ============================================================================
#  Codes couleur & et &#RRGGBB acceptés. Format SkyHand pour le chat : préfixe
#  de la couleur du type, texte en &7, mots importants dans la couleur du type.
#    &a succès · &e information · &6 avertissement · &c erreur
#  Un message vide n'est pas envoyé.
#
#  Menus : chaque bouton a un « nom » et un « lore » (liste de lignes). Une ligne
#  faite seulement d'un {bloc} est remplacée par les lignes de ce bloc, ou par
#  rien s'il est vide ; les lignes vides en double disparaissent.
# ============================================================================

chat:
  tache-faite: "&7&l« &a&lJake &8&l» &7Tâche du jour faite, &a{reste}&7."
  reste-plusieurs: "plus que {n}"
  reste-une: "plus qu'une"
  programme-complet: "&7&l« &a&lJake &8&l» &7Programme du jour &acomplet &7! Votre récompense vous attend dans &a/jake&7."
  recompense: "&7&l« &a&lJake &8&l» &7Récompense récupérée. Série de &a{serie} jour(s)&7."
  recompense-palier: "&7&l« &a&lJake &8&l» &7Palier de série atteint, &a{jour} jours &7!"
  rien-a-prendre: "&7&l« &e&lJake &8&l» &7Rien à récupérer pour l'instant."
  chargement: "&7&l« &e&lJake &8&l» &7Votre guide se charge, réessayez dans une seconde."
  joueurs-seulement: "&7&l« &c&lJake &8&l» &7Commande réservée aux joueurs."
  permission: "&7&l« &c&lJake &8&l» &7Vous n'avez pas la permission."
  utilisation: "&7&l« &e&lJake &8&l» &7Tapez &e{commandes}&7."
  joueur-inconnu: "&7&l« &c&lJake &8&l» &7Joueur &c{joueur} &7introuvable ou pas connecté."
  reload-ok: "&7&l« &a&lSHGuide &8&l» &7Configuration rechargée."
  reload-erreur: "&7&l« &c&lSHGuide &8&l» &7{fichier} invalide, rien n'a changé. &c{erreur}"
  annonce-ok: "&7&l« &a&lSHGuide &8&l» &7Annonce posée, début dans &a{minutes} min&7."
  set-ok: "&7&l« &a&lSHGuide &8&l» &7{champ} de &a{joueur} &7mis à &a{valeur}&7."
  set-erreur: "&7&l« &c&lSHGuide &8&l» &7Valeur refusée pour {champ}, &c{valeur}&7."
  reset-ok: "&7&l« &a&lSHGuide &8&l» &7Guide de &a{joueur} &7remis à zéro."
  info:
    - "&7&l« &e&lSHGuide &8&l» &e{joueur} &7jour {jour}, palier {palier}, tâches {faites}/{total}"
    - "&7Série {serie} (record {record}), joker {joker}, dernière venue {venue}, à prendre {attente}"

# Objectif du moment (aussi affiché dans le scoreboard)
objectif:
  aucun: "Explorer votre île"
  presque: "Plus que {reste} · {tache}"
  annonce-bientot: "{texte} dans {minutes} min"
  annonce-commence: "{texte} commence"

menu:
  titre: "&8&lJake &8| Votre guide"
  titre-aide: "&8&lJake &8| Comment faire ?"

  jake:
    nom: "&eJake, votre guide"
    lore:
      - ""
      - "&8&l« &f{phrase} &8&l»"
      - ""
      - "&7Chaque jour, Jake vous donne &e{total} tâches"
      - "&7simples. Finissez-les pour gagner une"
      - "&erécompense &7et faire grimper votre &6série&7."
    phrase-debut: "Salut {joueur}, voici vos tâches du jour !"
    phrase-encours: "Courage {joueur}, plus que {reste} tâche(s) !"
    phrase-prete: "Bravo {joueur}, votre récompense est prête !"
    phrase-fini: "Bien joué {joueur}, revenez demain !"

  objectif:
    nom: "&bObjectif du moment"
    lore:
      - ""
      - "&8&l« &7Ce que Jake vous conseille"
      - "&7de faire maintenant. &8&l»"
      - ""
      - " &b➜ &f{texte}"
      - "{description}"
      - ""
      - "{clic}"
    clic: "&7&o(( &b&oCliquez pour y aller &7&o))"

  tache:
    nom: "&b{texte}"
    nom-fait: "&a✔ {texte}"
    lore:
      - "&8Tâche du jour {numero}/{total}"
      - ""
      - "{description}"
      - ""
      - " &b• &7Progression: &f{actuel}&7/&f{objectif}"
      - " {barre}"
      - ""
      - "{clic}"
    lore-fait:
      - "&8Tâche du jour {numero}/{total}"
      - ""
      - "&a✔ &7Tâche faite, bravo !"
    clic: "&7&o(( &b&oCliquez pour y aller &7&o))"
    sans-clic: ""
    barre-pleine: "&b■"
    barre-vide: "&8■"
    barre-cases: 10

  recompense:
    nom-fermee: "&6Récompense du jour"
    lore-fermee:
      - ""
      - "&8&l« &7Finissez les &6{total} tâches &7du jour"
      - "&7pour débloquer ce coffre. &8&l»"
      - ""
      - " &6• &7Tâches faites: &f{faites}&7/&f{total}"
    nom-prete: "&aRécompense du jour"
    lore-prete:
      - ""
      - "&8&l« &7Les &a{total} tâches &7sont faites,"
      - "&7votre récompense est prête ! &8&l»"
      - ""
      - "&7&o(( &a&oCliquez pour la récupérer &7&o))"
    nom-prise: "&7Récompense récupérée"
    lore-prise:
      - ""
      - "&8&l« &7Revenez demain pour un"
      - "&7nouveau programme. &8&l»"

  serie:
    nom: "&6Série de {serie} jour(s)"
    lore:
      - ""
      - "&8&l« &7Finissez votre programme chaque"
      - "&7jour pour faire grimper votre série. &8&l»"
      - ""
      - " &6• &7Prochain palier: &fjour {palier} &7(dans {reste} j)"
      - "{gain}"
      - " &6• &7Record: &f{record} jour(s)"
      - ""
      - "{joker}"
    gain: " &6• &7Gain du palier: &f{gain}"
    # Ce que donne chaque palier de serie.paliers (config.yml), montré sous « Prochain palier ».
    gains:
      7: "un bonus"
    joker-oui:
      - "&a✔ &7Joker disponible: un jour raté"
      - "&7cette semaine ne casse pas la série."
    joker-non:
      - "&8✘ &7Joker déjà utilisé cette semaine:"
      - "&7un jour raté remet la série à zéro."

  aide:
    nom: "&eComment faire ?"
    lore:
      - ""
      - "&8&l« &7Les réponses aux questions que"
      - "&7se posent les nouveaux joueurs. &8&l»"
      - ""
      - "&7&o(( &e&oCliquez pour ouvrir &7&o))"

  ile:
    nom: "&aMenu de votre île"
    lore:
      - ""
      - "&8&l« &7Téléportation, quêtes, membres"
      - "&7et améliorations de votre &aîle&7. &8&l»"
      - ""
      - "&7&nCommande:&a /is"
      - ""
      - "&7&o(( &a&oCliquez pour ouvrir &7&o))"

  reglages:
    nom: "&eParamètres du NPC Jake"
    lore:
      - ""
      - "&8&l« &7Affichez les options de"
      - "&7modifications du &eNPC Jake &8&l»"
      - ""
      - "&7&o(( &e&oCliquez pour ouvrir &7&o))"

  retour:
    nom: "&c⤾ Retour &7(Clic)"
    lore: []

# Retour après une absence, pour les versions sans dialogues (le dialogue vient de SHDialogs)
retour:
  chat:
    - "&7&l« &e&lJake &8&l» &7Content de vous revoir, &e{joueur} &7!"
    - "&7Votre objectif du moment, &e{objectif}&7."
  nouveaute: "&8• &7{texte}"
  bouton: "&e&l[Voir Jake]"
